<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0e1116;--surface:#161a21;--surface-2:#1c2129;--ink:#eef1f5;--ink-2:#b3bbc7;--muted:#828c9a;--line:#29303a;--line-2:#3a424e;
  --accent:#9aa5ff;--on-accent:#0e1116;--lane-a:#13171d;--lane-b:#171b22;
  --SH:#c3c9d4;--CEO:#9085e9;--CFO:#2fbf94;--CMO:#f07a45;--CSO:#5aa0f0;--COO:#5cc04a;--edge:#5d6674;--esc:#ef6b6b;--hl:#f2b01e}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0e1116;--surface:#161a21;--surface-2:#1c2129;--ink:#eef1f5;--ink-2:#b3bbc7;--muted:#828c9a;--line:#29303a;--line-2:#3a424e;
  --accent:#9aa5ff;--on-accent:#0e1116;--lane-a:#13171d;--lane-b:#171b22;
  --SH:#c3c9d4;--CEO:#9085e9;--CFO:#2fbf94;--CMO:#f07a45;--CSO:#5aa0f0;--COO:#5cc04a;--edge:#5d6674;--esc:#ef6b6b;--hl:#f2b01e}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto}
header h1 span{font-weight:400;color:var(--ink-2)}
.grp{display:flex;flex-direction:column;gap:3px}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface);gap:1px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:5px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
select,input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px}
input[type=search]{width:190px}
.chk{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.chk label{display:flex;gap:4px;align-items:center;cursor:pointer}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg:active{cursor:grabbing}
aside{width:340px;flex:none;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:45vh}#stage{min-height:55vh}}
aside h2{margin:0;font-size:16px;letter-spacing:-.01em}
aside h3{margin:0 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.role{color:#fff;border-color:transparent}
.list{display:flex;flex-direction:column;gap:3px}
.list button{all:unset;cursor:pointer;font-size:12px;padding:4px 6px;border-radius:5px;display:flex;gap:8px;align-items:baseline}
.list button:hover{background:var(--surface-2)}
.list button:focus-visible{outline:2px solid var(--accent)}
.list .id{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:46px}
.list .k{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap}
.insight{background:var(--surface-2);border-radius:8px;padding:9px 11px;font-size:12.5px;border-left:3px solid var(--hl)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:11.5px;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-2);line-height:1.5}
svg text{font-family:var(--sans)}
.node{cursor:pointer}
.node .id{font-family:var(--mono);font-size:9.5px;font-weight:500}
.node .lbl{font-size:11px;fill:var(--ink)}
.dim{opacity:.12}
.lane-title{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.col-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;fill:var(--muted)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#tip{max-width:360px;line-height:1.45}#tip b{display:block;font-size:13px;margin-bottom:1px}.tt-k{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.tt-r{margin-top:6px}.tt-r>span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}#tip code{font-family:var(--mono);font-size:11px;color:var(--ink)}
.zoombtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoombtns button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Executive Metric Map <span>· roles → jobs → problems → metrics by tier → actions</span></h1>
  <div class="grp"><span class="lab">Layout</span><div class="seg" id="v-layout"><button data-v="tree" aria-pressed="true">Tree</button><button data-v="web" aria-pressed="false">Web</button></div></div>
  <div class="grp"><span class="lab">View</span><div class="seg" id="v-mode"><button data-v="full" aria-pressed="true">Full map</button><button data-v="owner" aria-pressed="false">Ownership</button><button data-v="collab" aria-pressed="false">Collaboration</button></div></div>
  <div class="grp"><label class="lab" for="v-role">Role</label><select id="v-role"><option value="all">All roles</option><option value="CEO">CEO</option><option value="CFO">CFO</option><option value="CMO">CMO</option><option value="CSO">Chief Sales Officer</option><option value="COO">COO</option></select></div>
  <div class="grp"><label class="lab" for="v-search">Find</label><input type="search" id="v-search" list="v-ids" placeholder="ID or name, e.g. F4"><datalist id="v-ids"></datalist></div>
  <div class="grp"><span class="lab">Show</span><div class="chk">
    <label><input type="checkbox" id="c-cross" checked> Cross-role links</label>
    <label><input type="checkbox" id="c-diag"> Diagnosed-by</label>
    <label><input type="checkbox" id="c-deep" checked> Tiers 3–4</label>
    <label><input type="checkbox" id="c-ins"> Insights</label>
  </div></div>
</header>
<main>
  <div id="stage"><svg id="svg" role="img" aria-label="Interactive metric map"></svg>
    <div class="zoombtns"><button id="z-in" aria-label="Zoom in">+</button><button id="z-out" aria-label="Zoom out">−</button><button id="z-fit" aria-label="Fit to screen">⤢</button></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>
<div id="tip" hidden></div>

const trunc=(s,k)=>s.length>k?s.slice(0,k-1)+'…':s;
function linkPath(e){const s=byId.get(e.s),t=byId.get(e.t);const[sx,sy]=pos(s),[tx,ty]=pos(t);
 if(st.layout==='web'){const x1=sx+NW/2,y1=sy+NH/2,x2=tx+NW/2,y2=ty+NH/2;const mx=(x1+x2)/2+(y2-y1)*.12,my=(y1+y2)/2-(x2-x1)*.12;return `M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}`}
 if(tx>sx+5){const x1=sx+NW,y1=sy+NH/2,x2=tx,y2=ty+NH/2,dx=(x2-x1)*.5;return `M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}
 if(tx<sx-5){const x1=sx,y1=sy+NH/2,x2=tx+NW,y2=ty+NH/2,dx=Math.max(40,(x1-x2)*.5);return `M${x1} ${y1} C${x1-dx} ${y1} ${x2+dx} ${y2} ${x2} ${y2}`}
 const x1=sx+NW,y1=sy+NH/2,x2=tx+NW,y2=ty+NH/2,b=40+Math.min(120,Math.abs(y2-y1)*.15);return `M${x1} ${y1} C${x1+b} ${y1} ${x2+b} ${y2} ${x2} ${y2}`}
function edgeStyle(e){const s=byId.get(e.s);
 switch(e.k){case'job':case'monitors':return{c:'var(--edge)',w:1,d:null,o:.55};
  case'measured':return{c:laneColor(s.lane),w:1.5,d:isCross(e)?'5 4':null,o:isCross(e)?.35:.8};
  case'diagnosed':return{c:laneColor(s.lane),w:1,d:'1 4',o:.6};
  case'explained':return{c:'var(--edge)',w:1.2,d:null,o:.7};
  case'feeds':return{c:'var(--edge)',w:1.1,d:'3 3',o:.28};
  case'ends':return{c:'var(--edge)',w:1,d:'1 3',o:.45};
  case'influences':return{c:laneColor(s.lane==='SH'?'SH':s.lane),w:1.6,d:'6 4',o:.45};
  case'mirrors':return{c:laneColor(s.lane),w:2.4,d:'2 3',o:.8};
  case'escalates':return{c:'var(--esc)',w:2,d:'6 3',o:.9}}}
function edgeVisible(e){const s=byId.get(e.s),t=byId.get(e.t);if(s.tx==null||t.tx==null)return false;
 if(e.k==='diagnosed'&&!st.diag)return false;if(CROSS.has(e.k)&&!st.cross)return false;
 if(st.mode==='collab'&&!CROSS.has(e.k)&&!isCross(e))return false;return true}

let selSet=null;
function draw(animate){
 const T=animate?d3.transition().duration(550):null;
 // lanes
 const lanes=gLanes.selectAll('g.lane').data(st.layout==='tree'?LANES:[],d=>d.id);
 lanes.exit().remove();
 const le=lanes.enter().append('g').attr('class','lane');
 le.append('rect');le.append('text').attr('class','lane-title');
 gLanes.selectAll('g.lane').each(function(d,i){const b=laneBox[d.id];const g=d3.select(this);
  g.select('rect').attr('x',0).attr('y',b.y).attr('width',COLS.length*COLW+20).attr('height',b.h).attr('rx',12).attr('fill',i%2?'var(--lane-b)':'var(--lane-a)').attr('stroke','var(--line)');
  g.select('text').attr('x',14).attr('y',b.y+15).attr('fill',laneColor(d.id)).text(d.name)});
 const cols=gCols.selectAll('text').data(st.layout==='tree'?COLS:[]);cols.exit().remove();
 cols.enter().append('text').attr('class','col-title').merge(cols).attr('x',(d,i)=>20+i*COLW+NW/2).attr('y',30).attr('text-anchor','middle').text(d=>d);
 // links
 const ed=E.filter(edgeVisible);
 const lk=gLinks.selectAll('path').data(ed,e=>e.s+'>'+e.t+e.k);lk.exit().remove();
 const lkm=lk.enter().append('path').attr('fill','none').merge(lk);
 lkm.each(function(e){const s=edgeStyle(e);d3.select(this).attr('stroke',s.c).attr('stroke-width',s.w).attr('stroke-dasharray',s.d).attr('data-o',s.o)});
 (T?lkm.transition(T):lkm).attr('d',linkPath);
 // nodes
 const nd=N.filter(n=>n.tx!=null);
 const ns=gNodes.selectAll('g.node').data(nd,n=>n.id);ns.exit().remove();
 const ne=ns.enter().append('g').attr('class','node').attr('tabindex',0).attr('role','button').attr('aria-label',n=>n.id+' '+n.label);
 ne.append('path').attr('class','shape');ne.append('text').attr('class','id');ne.append('text').attr('class','lbl');ne.append('circle').attr('class','ib').attr('r',4.5);
 const nm=ne.merge(ns);
 nm.select('.shape').attr('d',shapePath).attr('fill',fillFor).attr('stroke',nodeColor)
  .attr('stroke-width',n=>n.type==='SH'?3:n.type==='T1'?2.2:n.type==='T2'?1.5:1)
  .attr('stroke-dasharray',n=>n.type==='T4'?'4 3':n.roadmap?'3 3':null).attr('opacity',n=>n.roadmap?.55:1);
 nm.select('.id').attr('x',9).attr('y',14).attr('fill',n=>n.type==='role'?'#fff':nodeColor(n)).text(n=>n.type==='role'?'ROLE':n.type==='action'?'ACTION':n.id+(n.roadmap?' · roadmap':'')+(n.type==='alert'?' · alert':''));
 nm.select('.lbl').attr('x',9).attr('y',28).attr('fill',n=>n.type==='role'?'#fff':'var(--ink)').style('font-weight',n=>n.type==='role'||n.type==='T1'||n.type==='SH'?600:400).text(n=>trunc(n.label,29));
 nm.select('.ib').attr('cx',NW-8).attr('cy',8).attr('fill','var(--hl)').attr('display',n=>INS[n.id]?null:'none');
 (T?nm.transition(T):nm).attr('transform',n=>{const[x,y]=pos(n);return `translate(${x},${y})`});
 nm.on('click',(ev,n)=>{ev.stopPropagation();select(n.id);focusNode(n.id)}).on('keydown',(ev,n)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);focusNode(n.id)}})
  .on('mousemove',(ev,n)=>showTip(ev,n)).on('mouseleave',hideTip);
 // insight bubbles
 const ins=gIns.selectAll('g').data(st.ins?nd.filter(n=>INS[n.id]):[],n=>n.id);ins.exit().remove();
 const ie=ins.enter().append('g');ie.append('rect');ie.append('text');
 ie.merge(ins).each(function(n){const[x,y]=pos(n);const g=d3.select(this);const t=trunc(INS[n.id],46);
  g.select('text').attr('x',x+8).attr('y',y-8).attr('font-size',10.5).attr('fill','var(--ink)').text(t);
  const w=t.length*5.5+14;g.select('rect').attr('x',x).attr('y',y-22).attr('width',w).attr('height',19).attr('rx',9).attr('fill','var(--surface)').attr('stroke','var(--hl)')});
 applyDim()}

/* ================= HIGHLIGHT / FILTER ================= */
function related(id){
 const s=new Set([id]);const down=[id],up=[id];
 const struct=E.filter(e=>STRUCT.has(e.k)&&(e.k!=='diagnosed'||st.diag));
 while(down.length){const c=down.pop();struct.forEach(e=>{if(e.s===c&&!s.has(e.t)&&e.k!=='feeds'){s.add(e.t);down.push(e.t)}})}
 const ups=new Set([id]);
 while(up.length){const c=up.pop();struct.forEach(e=>{if(e.t===c&&!ups.has(e.s)&&e.k!=='feeds'){ups.add(e.s);s.add(e.s);up.push(e.s)}})}
 E.forEach(e=>{if((CROSS.has(e.k)||e.k==='feeds')&&(e.s===id||e.t===id)){s.add(e.s);s.add(e.t)}});
 return s}
function roleSet(r){const s=new Set();N.forEach(n=>{if(n.lane===r||n.lane==='SH')s.add(n.id)});
 E.forEach(e=>{const a=byId.get(e.s),b=byId.get(e.t);if(a.lane===r||b.lane===r){if(CROSS.has(e.k)||isCross(e)||e.k==='feeds'){s.add(e.s);s.add(e.t)}}});s.add('A-'+r);return s}
function applyDim(){
 let keep=null;
 if(selSet)keep=selSet;else if(st.role!=='all')keep=roleSet(st.role);
 if(st.mode==='collab'&&!selSet){keep=new Set(HOT);E.filter(e=>CROSS.has(e.k)).forEach(e=>{keep.add(e.s);keep.add(e.t)})}
 gNodes.selectAll('g.node').classed('dim',n=>keep&&!keep.has(n.id)).select('.shape').attr('stroke-width',n=>(st.mode==='collab'&&HOT.has(n.id))||(selSet&&n.id===st.sel)?3.5:n.type==='SH'?3:n.type==='T1'?2.2:n.type==='T2'?1.5:1)
  .attr('stroke',n=>selSet&&n.id===st.sel?'var(--hl)':nodeColor(n));
 gLinks.selectAll('path').attr('opacity',function(e){const o=+this.getAttribute('data-o');if(!keep)return o;return keep.has(e.s)&&keep.has(e.t)?Math.min(1,o+.2):.05});
 gIns.selectAll('g').classed('dim',n=>keep&&!keep.has(n.id))}

/* ================= PANEL ================= */
const panel=document.getElementById('panel');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KLBL={job:'job',monitors:'monitors',measured:'measured by',diagnosed:'diagnosed by',explained:'explained by',ends:'ends in',feeds:'feeds',influences:'influences',mirrors:'same data',escalates:'escalates to'};
function item(id,k){const n=byId.get(id);return `<button data-id="${id}"><span class="id">${esc(n.type==='role'?'ROLE':id)}</span><span>${esc(n.label)}</span><span class="k">${esc(k||'')}</span></button>`}
function select(id){st.sel=id;selSet=id?related(id):null;applyDim();renderPanel();}
function renderPanel(){
 if(!st.sel){panel.innerHTML=`<h2>How to read this map</h2>
  <p class="hint">Each band is one executive role. Read left to right: <b>role → jobs → problems they monitor → tier-1 outcomes → tier-2 drivers → tier-3 locators → tier-4 evidence → action</b>. The top band is the <b>company pulse strip</b> every role sees.</p>
  <p class="hint"><b>Click any node</b> to highlight its full path up to the role and down to evidence and action, plus any links to other roles. Click empty space to clear.</p>
  <div><h3>Node types</h3><div class="legend">${legendRows()}</div></div>
  <div><h3>Link types</h3><div class="legend">${edgeLegend()}</div></div>
  <div><h3>Views</h3><p class="hint"><b>Ownership</b> colours metrics by the executive who owns them, not the view they sit in. <b>Collaboration</b> keeps only cross-role links and the hotspots where 2+ roles meet. <b>Web</b> lays the same graph out as a force-directed network.</p></div>`;bindPanel();return}
 const n=byId.get(st.sel);
 const out=E.filter(e=>e.s===n.id),inc=E.filter(e=>e.t===n.id);
 const grp=(arr,f)=>arr.length?arr.map(f).join(''):'<span class="hint">—</span>';
 const laneName=LANES.find(l=>l.id===n.lane)?.name||n.lane;
 const ownerTag=n.owner?`<span class="tag role" style="background:${laneColor(ownerLane(n.owner))}">Owner: ${esc(n.owner)}</span>`:'';
 panel.innerHTML=`<div><h3>${esc(TYPENAME[n.type])}${n.roadmap?' · roadmap':''}</h3><h2>${esc(n.type==='role'?n.label:n.id+' · '+n.label)}</h2></div>
  <div class="meta"><span class="tag role" style="background:${laneColor(n.lane)}">${esc(n.type==='action'?n.lane:laneName)}</span>${ownerTag}${HOT.has(n.id)?'<span class="tag">Collaboration hotspot</span>':''}</div>
  ${(()=>{const x=info(n);return (x.m?`<div><h3>What it is</h3><p class="hint" style="margin:0">${esc(x.m)}</p></div>`:'')+(x.f?`<div><h3>Formula</h3><p class="hint" style="margin:0;font-family:var(--mono);font-size:11.5px">${esc(x.f)}</p></div>`:'')+(x.i?`<div><h3>So what</h3><p class="hint" style="margin:0">${esc(x.i)}</p></div>`:'')+(x.see.length?`<div><h3>Also consider</h3><div class="list">${x.see.map(id=>item(id,'')).join('')}</div></div>`:'')})()}${n.def?`<div><h3>Data</h3><p class="hint" style="margin:0">${esc(n.def)}</p></div>`:''}
  ${INS[n.id]?`<div><h3>Insight (synthetic example)</h3><div class="insight">${esc(INS[n.id])}</div></div>`:''}
  <div><h3>Comes from (upstream)</h3><div class="list">${grp(inc,e=>item(e.s,KLBL[e.k]+(e.label&&CROSS.has(e.k)?': '+e.label:'')))}</div></div>
  <div><h3>Leads to (downstream)</h3><div class="list">${grp(out,e=>item(e.t,KLBL[e.k]+(e.label&&CROSS.has(e.k)?': '+e.label:'')))}</div></div>
  <button class="tag" id="clr" style="align-self:flex-start;cursor:pointer;background:var(--surface)">Clear selection</button>`;
 bindPanel()}
function bindPanel(){panel.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{select(b.dataset.id);focusNode(b.dataset.id)});const c=document.getElementById('clr');if(c)c.onclick=()=>select(null)}
function legendRows(){const sw=(t,extra='')=>`<svg width="40" height="18" aria-hidden="true"><rect x="1" y="2" width="38" height="14" rx="${t==='role'?6:t==='T4'?7:3}" fill="${t==='role'?'var(--CEO)':`color-mix(in oklab, var(--CEO) ${t==='T1'?22:t==='T2'?11:t==='T3'?5:0}%, var(--surface))`}" stroke="${t==='SH'?'var(--SH)':'var(--CEO)'}" stroke-width="${t==='SH'?3:t==='T1'?2.2:1.2}" ${t==='T4'?'stroke-dasharray="4 3"':''}/></svg>`;
 return [['role','Role'],['job','Job'],['problem','Problem (hexagon)'],['SH','Shared strip metric'],['T1','Tier 1 · first screen'],['T2','Tier 2 · one click'],['T3','Tier 3 · drill-down'],['T4','Tier 4 · evidence']].map(([t,l])=>t==='problem'?`<svg width="40" height="18" aria-hidden="true"><path d="M5 2H35L39 9L35 16H5L1 9Z" fill="none" stroke="var(--CEO)"/></svg><span>${l}</span>`:`${sw(t)}<span>${l}</span>`).join('')+'<svg width="40" height="18" aria-hidden="true"><circle cx="20" cy="9" r="4.5" fill="var(--hl)"/></svg><span>Has a sample insight</span>'}
function edgeLegend(){const ln=(c,d,w)=>`<svg width="40" height="12" aria-hidden="true"><path d="M2 6H38" stroke="${c}" stroke-width="${w}" ${d?`stroke-dasharray="${d}"`:''}/></svg>`;
 return [ln('var(--edge)',null,1.2)+'<span>Explained by (drill path)</span>',ln('var(--CEO)',null,1.5)+'<span>Problem measured by</span>',ln('var(--CEO)','1 4',1)+'<span>Problem diagnosed by (toggle)</span>',ln('var(--edge)','3 3',1.2)+'<span>Feeds a shared / higher metric</span>',ln('var(--CFO)','6 4',1.6)+'<span>Influences (cross-role)</span>',ln('var(--CFO)','2 3',2.4)+'<span>Same data in two roles</span>',ln('var(--esc)','6 3',2)+'<span>Escalates to CEO</span>',ln('var(--edge)','1 3',1)+'<span>Ends in action</span>'].join('')}

/* ================= TOOLTIP ================= */
const tip=document.getElementById('tip');
function lbl(id){const n=byId.get(id);return n.type==='role'?n.label:n.id}
function info(n){
 const out=E.filter(e=>e.s===n.id),inc=E.filter(e=>e.t===n.id);
 const isM=['SH','T1','T2','T3','T4','alert'].includes(n.type);
 let m,f,i;
 if(D[n.id])[m,f,i]=D[n.id];
 else if(n.type==='role'){m=n.alt;i='Tier-1 view: '+N.filter(x=>x.lane===n.lane&&x.type==='T1').map(x=>x.label).join('; ')+'. Also sees the shared pulse strip.'}
 else if(n.type==='job'){const ps=out.filter(e=>e.k==='monitors').map(e=>byId.get(e.t).label);m=`A core job of the ${LANES.find(l=>l.id===n.lane).name.split(' ·')[0]}${n.roadmap?' (roadmap — not in the prototype)':''}.`;i=ps.length?'Problems watched under this job: '+ps.join('; ')+'.':'Out of scope for now.'}
 else if(n.type==='problem'){const me=out.filter(e=>e.k==='measured').map(e=>lbl(e.t)),dg=out.filter(e=>e.k==='diagnosed').map(e=>lbl(e.t));const rn=LANES.find(l=>l.id===n.lane).name.split(' ·')[0];m=`An issue the ${rn} watches for. When "${n.label.toLowerCase()}" happens, this is the path they follow.`;i=`Spot it in ${me.map(x=>x+' '+byId.get(x).label).join('; ')}. Diagnose with ${dg.join(', ')}.`}
 else if(n.type==='action'){m='What this executive can do once the cause is found.';i=n.label}
 const see=[];const add=id=>{if(id!==n.id&&!see.includes(id)&&isMetric(byId.get(id)))see.push(id)};
 if(isM){out.filter(e=>e.k==='explained').forEach(e=>add(e.t));E.filter(e=>(CROSS.has(e.k))&&(e.s===n.id||e.t===n.id)).forEach(e=>add(e.s===n.id?e.t:e.s));inc.filter(e=>e.k==='explained').forEach(e=>add(e.s));out.filter(e=>e.k==='feeds').forEach(e=>add(e.t))}
 else if(n.type==='problem'){out.forEach(e=>add(e.t))}
 return{m,f:f&&f!=='—'?f:null,i,see:see.slice(0,6)}}
function isMetric(n){return n&&['SH','T1','T2','T3','T4','alert'].includes(n.type)}
function showTip(ev,n){const x=info(n);
 tip.innerHTML=`<b>${esc(n.type==='role'?n.label:n.id+' · '+n.label)}</b><span class="tt-k">${esc(TYPENAME[n.type])}${n.owner&&n.owner!=='—'?' · owner '+esc(n.owner):''}</span>`+
  (x.m?`<div class="tt-r"><span>What it is</span>${esc(x.m)}</div>`:'')+(x.f?`<div class="tt-r"><span>Formula</span><code>${esc(x.f)}</code></div>`:'')+
  (x.i?`<div class="tt-r"><span>So what</span>${esc(x.i)}</div>`:'')+(x.see.length?`<div class="tt-r"><span>Also consider</span>${x.see.map(id=>esc(lbl(id)+' '+byId.get(id).label)).join('<br>')}</div>`:'')+
  (INS[n.id]?`<div class="tt-r"><span>Example insight</span><i>${esc(INS[n.id])}</i></div>`:'');
 tip.hidden=false;
 const r=tip.getBoundingClientRect();let px=ev.clientX+16,py=ev.clientY+16;if(px+r.width>innerWidth-8)px=ev.clientX-r.width-16;if(py+r.height>innerHeight-8)py=Math.max(8,innerHeight-r.height-8);tip.style.left=px+'px';tip.style.top=py+'px'}
function hideTip(){tip.hidden=true}

/* ================= CONTROLS ================= */
function seg(id,key,after){const el=document.getElementById(id);el.onclick=e=>{const b=e.target.closest('button');if(!b)return;st[key]=b.dataset.v;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));after()}}
seg('v-layout','layout',()=>{if(st.layout==='web'&&N[0].wx==null)webLayout();draw(true);setTimeout(fit,600)});
seg('v-mode','mode',()=>{draw(false)});
document.getElementById('v-role').onchange=e=>{st.role=e.target.value;select(null);applyDim();if(st.role!=='all')focusLane(st.role);else fit()};
const chk=(id,key,re)=>document.getElementById(id).onchange=e=>{st[key]=e.target.checked;if(re){laneBox=treeLayout();N.forEach(n=>n.wx=null);if(st.layout==='web')webLayout()}if(st.sel)selSet=related(st.sel);draw(!!re)};
chk('c-cross','cross');chk('c-diag','diag');chk('c-deep','deep',true);chk('c-ins','ins');
document.getElementById('v-ids').innerHTML=N.map(n=>`<option value="${n.type==='role'?n.label:n.id}">${esc(n.label)}</option>`).join('');
document.getElementById('v-search').onchange=e=>{const q=e.target.value.trim().toLowerCase();const n=N.find(n=>n.id.toLowerCase()===q)||N.find(n=>n.label.toLowerCase().includes(q));if(n){if(n.tx==null){document.getElementById('c-deep').checked=true;st.deep=true;laneBox=treeLayout();draw(false)}select(n.id);focusNode(n.id)}};
svg.on('click',()=>select(null));
document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null)});
document.getElementById('z-in').onclick=()=>svg.transition().call(zoom.scaleBy,1.3);
document.getElementById('z-out').onclick=()=>svg.transition().call(zoom.scaleBy,1/1.3);
document.getElementById('z-fit').onclick=fit;
function bounds(ids){const ns=N.filter(n=>n.tx!=null&&(!ids||ids.has(n.id)));const xs=ns.map(n=>pos(n)[0]),ys=ns.map(n=>pos(n)[1]);return[Math.min(...xs)-20,Math.min(...ys)-40,Math.max(...xs)+NW+20,Math.max(...ys)+NH+20]}
function fitTo(b){const el=document.getElementById('stage');const W=el.clientWidth,H=el.clientHeight;const k=Math.min(2,Math.max(.15,Math.min(W/(b[2]-b[0]),H/(b[3]-b[1]))));
 svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*(b[0]+b[2])/2,H/2-k*(b[1]+b[3])/2).scale(k))}
function fit(){fitTo(bounds(null))}
function focusLane(r){fitTo(bounds(new Set(N.filter(n=>n.lane===r||(n.lane==='SH')).map(n=>n.id))))}
function focusNode(id){const n=byId.get(id);if(!n||n.tx==null)return;const s=selSet||new Set([id]);fitTo(bounds(s))}

draw(false);renderPanel();requestAnimationFrame(fit);
addEventListener('resize',()=>{});
})();
</script>
