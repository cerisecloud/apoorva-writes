<style>
:root{
  color-scheme: light;
  --ink:#16191d; --ink-2:#4f5661; --muted:#6b7280; --line:#e4e7eb; --line-2:#cdd2d8; --hover:#f6f7f9; --track:#eceff2;
  --accent:#1f5bd6; --accent-soft:#edf2fd; --pos:#2a78d6; --neg:#d0342c;
  --good:#1a7336; --good-bg:#e7f4ec; --good-t:#1a7336; --crit-t:#b4231b; --warn:#8a5a00; --warn-bg:#fdf3d8; --crit:#b4231b; --crit-bg:#fbe8e6; --opp:#5a43b8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --display:"Archivo","IBM Plex Sans",system-ui,sans-serif; --text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:14px; --r:10px; --r-sm:8px;
  --e-pro:cubic-bezier(.2,0,.38,.9); --e-exp:cubic-bezier(0,0,.3,1);

}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:#ffffff;color:var(--ink)}
body{margin:0;font-family:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1280px}
::selection{background:#d7e3fb}
button,select,input,textarea{font:inherit;color:inherit}
select,input,textarea{background-color:#fff;color:var(--ink);color-scheme:light}option{background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:min(1312px,calc(100% - 96px));margin:0 auto;padding-bottom:72px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{width:min(1312px,calc(100% - 96px));margin:0 auto;height:64px;display:flex;align-items:center;gap:12px}

.chip{height:36px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;white-space:nowrap;transition:border-color var(--t1) var(--e-pro),background var(--t1) var(--e-pro)}
.chip:hover{border-color:var(--ink-2)}
.chip.view{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip .k{color:var(--muted)}
.ask-g{flex:1;max-width:520px;margin-left:auto;position:relative}
.ask-g input{width:100%;height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 40px 0 36px;font-size:13px;background:#fff;transition:border-color var(--t1),box-shadow var(--t2)}

.ask-g kbd{position:absolute;right:10px;top:8px;font:500 11px/18px var(--text);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.bm-n{font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.bm-n:empty{display:none}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:40;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 16px 40px rgba(22,25,29,.12);padding:14px;display:grid;gap:8px;width:max-content;animation:pop var(--t2) var(--e-exp)}
.pop .plab{font-size:12px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}

.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.filt b{font-weight:600;color:var(--ink)}.chip.filt .f-sep{width:1px;height:16px;background:var(--line-2)}.chip.filt #period-lab{color:var(--ink-2)}
.seg button.cust-b{border-left:1px solid var(--line);border-radius:0 6px 6px 0;margin-left:2px}.seg button.cust-b.open{background:var(--hover);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.cust{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fafbfc;animation:pop var(--t2) var(--e-exp)}
.cust-row{display:flex;align-items:center;gap:8px}.cust-row .to{font-size:12px;color:var(--muted)}
.cust-f{flex:1;display:grid;gap:3px;min-width:150px}.cust-f span{font-size:11px;color:var(--muted);font-weight:500}

.cust-cal{display:flex;align-items:center;justify-content:center;gap:10px;height:120px;border:1px dashed var(--line-2);border-radius:var(--r-sm);background:#fff;color:var(--ink-2);font-size:13px;text-align:center;padding:0 16px}
.cust-cal svg{flex:none;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}

/* summary */
.summary{padding:28px 0 0}
.sum-card{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;animation:rise var(--t4) var(--e-exp) both}
.sum-main{padding:22px 28px 22px}.sum-next{padding:22px 28px;border-left:1px solid var(--line);background:#fbfbfc;border-radius:0 var(--r-lg) var(--r-lg) 0}
.sum-next h4,.sum-watch h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sum-watch{margin-top:14px}
.h4-sub{font-weight:400;color:var(--muted)}
ul.next li::before{top:12px}
.nx{all:unset;cursor:pointer;display:grid;gap:2px;border-radius:6px;padding:3px 6px;margin:-3px -6px;transition:background var(--t1)}
.nx:hover{background:#f1f3f6}.nx:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nx-t{font-size:13.5px;line-height:1.45;color:var(--ink)}.nx:hover .nx-t{color:var(--accent)}
.nx-w{font-size:12px;color:var(--ink-2);line-height:1.4}.nx-w b{font-weight:600}
.nx-s{font-size:11.5px;color:var(--muted)}
.nx-all{margin-top:10px;font-size:12.5px}
.iss-list{display:grid;border-top:1px solid var(--line)}
.iss{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:8px minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);transition:background var(--t1)}
.iss:hover{background:var(--hover)}.iss:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.iss-dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}.iss-dot.crit{background:var(--neg)}.iss-dot.warn{background:#d39200}.iss-dot.opp{background:var(--opp)}.iss-dot.good{background:var(--good)}
.iss-b{min-width:0}.iss-b b{font-size:13.5px;font-weight:600}.iss-l{font-size:11.5px;color:var(--muted);margin-left:8px}
.iss-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:1.45;color:var(--ink-2);overflow:hidden;margin-top:1px}
.iss-i{font-size:11px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}.iss-i b{display:block;font-size:13px;font-weight:600}.iss-i b.fav{color:var(--good)}
.iss-more{margin-top:8px;font-size:12.5px}
.iss-go{color:var(--muted);transition:transform var(--t1)}.iss:hover .iss-go{transform:translateX(2px);color:var(--ink)}

.say{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-decoration-thickness:2px;text-underline-offset:6px;transition:color var(--t1),text-decoration-color var(--t1)}
.say:hover,.say:focus-visible{color:var(--accent);text-decoration-color:var(--accent)}.say:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.say .say-go{opacity:0;transition:opacity var(--t1)}.say:hover .say-go,.say:focus-visible .say-go{opacity:1}
.why-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px}
ol.why{margin:0;padding:0;list-style:none;counter-reset:w;display:grid;gap:12px}
ol.why li{counter-increment:w;display:grid;grid-template-columns:24px 1fr;gap:2px 10px;font-size:13.5px;line-height:1.5}
ol.why li::before{content:counter(w);grid-row:span 2;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center}
ol.why b{font-weight:600}ol.why span{color:var(--ink-2)}
.why-check{border-left:1px solid var(--line);padding-left:24px}.why-check h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.why-check ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
mark.kf{background:linear-gradient(transparent 56%,rgba(31,91,214,.17) 56%);color:inherit;padding:0 1px;border-radius:2px;font-weight:inherit}
.sum-meta .info{margin-left:4px;vertical-align:1px}
.sum-meta{margin:0 0 10px;font-size:13px;color:var(--muted)}
.ai{font-weight:600;color:var(--ink-2);cursor:help;border-bottom:1px dotted var(--line-2)}
.sum-h{margin:0;font-family:var(--display);font-weight:600;font-size:23px;line-height:1.35;letter-spacing:-.018em;max-width:1000px;text-wrap:balance}
.strip-eps{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;transition:border-color var(--t1)}
.strip-eps:hover{border-color:var(--ink-2)}.strip-eps b{color:var(--ink)}
.sum-cols{display:grid;grid-template-columns:5fr 7fr;gap:48px;margin-top:22px}
.sum-cols h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.watch{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;transition:border-color var(--t1),background var(--t1)}
.wchip:hover{border-color:var(--ink);background:var(--hover)}
.wchip span{color:var(--muted);margin-left:2px}
ul.next{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.next{gap:10px}ul.next li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.5}
ul.next li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* section heads */
h2.sec{margin:36px 0 14px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;margin:48px 0 14px}
.sec-row h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.sec-row p{margin:0;font-size:13px;color:var(--muted)}

/* metric cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px 18px;display:grid;grid-template-rows:auto auto auto auto auto 1fr;gap:6px;background:#fff;min-height:236px;transition:border-color var(--t2) var(--e-pro),background var(--t2) var(--e-pro),transform var(--t2) var(--e-pro);animation:rise var(--t4) var(--e-exp) both;animation-delay:var(--d)}
.card:hover{border-color:var(--line-2);background:var(--hover)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#fff}
.card.on::after{content:"";position:absolute;left:50%;bottom:-17px;width:14px;height:14px;background:#fff;border-left:1px solid var(--accent);border-top:1px solid var(--accent);transform:translateX(-50%) rotate(45deg);z-index:3}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c-name{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.c-val{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.1;letter-spacing:-.02em;margin-top:6px}
.c-delta{font-size:14px}
.bul{width:100%;height:14px;margin:8px 0 2px;display:block}
.bul .bar{transform-origin:left;animation:grow var(--t4) var(--e-exp) both;animation-delay:calc(var(--d) + 120ms)}
.c-ref{font-size:12.5px;color:var(--ink-2)}
.prov{display:inline-block;margin-left:4px;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;line-height:18px}
.c-ins{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px;align-self:end}
/* card anatomy: status band, metric, gap, value, trend, insight */
.card{padding:0 20px 16px;gap:4px;min-height:0;--tint:#f4f5f7;--sig:var(--ink-2)}
.card.s-crit{--tint:var(--crit-bg);--sig:var(--crit);border-color:#efc9c4}
.card.s-warn{--tint:var(--warn-bg);--sig:var(--warn);border-color:#efdcab}
.card.s-good{--tint:#eef7f1;--sig:var(--good)}
.card.s-opp{--tint:#f1edfc;--sig:var(--opp)}
.card.on{border-color:var(--accent)}
.c-head{display:flex;justify-content:space-between;align-items:center;margin:0 -20px 8px;padding:9px 20px;background:var(--tint);border-radius:calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px) 0 0}
.c-sig{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--sig);text-transform:uppercase;letter-spacing:.05em}
.c-sig::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-head .c-per{margin:0;background:rgba(255,255,255,.75)}
.card .c-name{font-size:14px;color:var(--ink)}
.c-gap{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px;font-size:14px;color:var(--ink-2);margin-top:2px}
.c-gap i{font-style:normal;font-size:15px;color:var(--sig)}
.c-gap b{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--sig)}
.c-gap b.flat{font-family:var(--text);font-size:18px;letter-spacing:0;color:var(--ink)}
.c-now{font-size:13px;color:var(--ink-2)}.c-now b{font-size:15px;font-weight:600;color:var(--ink)}
.c-ins{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-height:48px}
.c-ins>span:first-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-go{font-style:normal;color:var(--muted);transition:color var(--t1),transform var(--t1)}.card:hover .c-go{color:var(--accent);transform:translateX(2px)}
/* highlight bar: same order, laid out left to right */
.kbar{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto 16px;align-items:center;column-gap:20px;width:100%;margin-top:16px;padding-right:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;--tint:#f4f5f7;--sig:var(--ink-2);transition:border-color var(--t1)}
.kbar.s-crit{--tint:var(--crit-bg);--sig:var(--crit);border-color:#efc9c4}.kbar.s-warn{--tint:var(--warn-bg);--sig:var(--warn);border-color:#efdcab}.kbar.s-good{--tint:#eef7f1;--sig:var(--good)}
.kbar:hover{border-color:var(--sig)}.kbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kb-sig{align-self:stretch;display:flex;align-items:center;gap:7px;padding:0 16px;background:var(--tint);color:var(--sig);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.kb-sig::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.kb-main{display:grid;gap:1px;padding:11px 0;min-width:0}
.kb-name{font-size:12.5px;font-weight:500;color:var(--muted)}
.kb-gap{font-size:15px;color:var(--ink-2)}.kb-ctx{font-size:12.5px;color:var(--muted)}.kb-gap i{font-style:normal;color:var(--sig);margin-right:4px}.kb-gap b{font-size:18px;font-weight:700;color:var(--sig);margin-right:4px}
.kb-val{display:grid;justify-items:end;gap:1px;white-space:nowrap;font-size:13px;color:var(--ink-2)}.kb-val b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink)}.kb-val small{font-size:12px;color:var(--muted)}
.kb-viz svg{display:block}
.kb-go{font-style:normal;color:var(--muted)}.kbar:hover .kb-go{color:var(--accent)}
/* same anatomy for issue rows and watchlist tiles */
.s-crit{--tint:var(--crit-bg);--sig:var(--crit)}.s-warn{--tint:var(--warn-bg);--sig:var(--warn)}.s-good{--tint:#eef7f1;--sig:var(--good)}.s-opp{--tint:#f1edfc;--sig:var(--opp)}
.iss{grid-template-columns:minmax(0,1fr) 14px;padding:9px 10px 9px 12px;border-left:3px solid var(--sig,var(--line-2))}
.iss.s-crit{background:#fdf6f5}.iss.s-crit:hover{background:var(--crit-bg)}
.iss-s{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sig)}
.iss-s .iss-l{margin:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted)}
.iss-h{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;margin-top:1px}
.iss-g{font-size:13px;color:var(--ink-2)}.iss-g i{font-style:normal;color:var(--sig);margin-right:3px}.iss-b .iss-g b{font-size:14px;font-weight:700;color:var(--sig);margin-right:2px}
div.pin{display:block;padding:0;overflow:hidden}
.pin.s-crit{border-color:#efc9c4}.pin.s-warn{border-color:#efdcab}
.pin-head{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;background:var(--tint,var(--hover))}.pin-head .icon-btn{margin-left:auto}
.pin-was{font-size:11.5px;color:var(--ink-2);background:rgba(255,255,255,.8);border-radius:4px;padding:1px 6px}
.pin-open{padding:10px 14px 12px;gap:3px}
.pin-t{font-size:13.5px;font-weight:600;color:var(--ink);white-space:normal}
.pin-g{font-size:13px;color:var(--ink-2)}.pin-g i{font-style:normal;color:var(--sig)}.pin-g b{font-family:var(--display);font-size:20px;font-weight:600;color:var(--sig);margin:0 3px}
.pin-c{font-size:12px;color:var(--ink-2)}.pin-c>b{color:var(--ink);font-size:13px}
/* L2 tiles in the panel and the side panel for L2 and L3 */
.l2-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.l2{all:unset;box-sizing:border-box;cursor:pointer;display:grid;align-content:start;gap:3px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px 12px;background:#fff;overflow:hidden;transition:border-color var(--t1),transform var(--t1)}
.l2.s-crit{border-color:#efc9c4}.l2.s-warn{border-color:#efdcab}
.l2:hover{border-color:var(--sig);transform:translateY(-1px)}.l2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.l2 .c-head{margin:0 -14px 6px;padding:7px 14px;border-radius:0}
.l2 .c-name{font-size:13.5px;font-weight:600}
.l2 .c-gap b{font-size:22px}.l2 .c-gap b.flat{font-size:15px}
.l2-k{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.l2-i{font-size:12px;color:var(--muted);line-height:1.4;margin-top:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);z-index:70;background:#fff;border-left:1px solid var(--line-2);box-shadow:-18px 0 48px rgba(22,25,29,.14);overflow:auto;transform:translateX(24px);opacity:0;transition:transform var(--t3) var(--e-exp),opacity var(--t2)}
.drawer.in{transform:none;opacity:1}
.dr-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px 12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.dr-top .crumbs{font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}.dr-top .crumbs i{font-style:normal;color:var(--muted)}.dr-top .crumbs span{color:var(--ink);font-weight:600}
.dr-body{padding:16px 20px 28px;display:grid;gap:12px}
.dr-body h4{margin:8px 0 0;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dr-card{cursor:default}.dr-card:hover{background:#fff}
.dr-def{margin:0;font-size:13px;line-height:1.5;color:var(--ink-2)}.dr-def b{color:var(--ink);font-weight:600}
.dr-by{display:grid;border-top:1px solid var(--line)}
.dr-row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);border-left:3px solid var(--sig,var(--line-2));font-size:13px}
.dr-row:hover{background:var(--hover)}.dr-row b{font-weight:600}.dr-g{text-align:right;color:var(--sig);font-weight:600;font-size:12.5px}
.dr-full{justify-self:start;margin-top:4px}
.c-slot{position:absolute;right:22px;bottom:-22px;font-size:11px;color:var(--muted);opacity:0}
.info{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line-2);color:var(--muted);font-size:9.5px;font-weight:600;cursor:help}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* status pills and deltas */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.sev.good{background:var(--good-bg);color:var(--good)}.pill.sev.warn{background:var(--warn-bg);color:var(--warn)}.pill.sev.crit{background:var(--crit-bg);color:var(--crit)}.pill.sev.opp{background:#efeafc;color:var(--opp)}
.pill.dir{display:none}
.pill.meta{background:var(--hover);color:var(--ink-2)}.pill.meta::before{display:none}
.pill.ai{display:none}
.pill.own{background:var(--good-bg);color:var(--good)}
.dv{font-weight:600;white-space:nowrap}
.dv.fav{color:var(--good)}.dv.unf{color:var(--crit)}.dv.neu{color:var(--ink-2)}
.dv small{font-weight:400;color:var(--muted);font-size:inherit}
.unf{color:var(--crit)}

/* bookmarks */
.pin-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pin{display:flex;align-items:flex-start;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 12px 14px;animation:rise var(--t3) var(--e-exp);background:#fff;min-width:0}
.pin.flip{border-color:var(--warn)}
.pin-open{all:unset;cursor:pointer;flex:1;display:grid;gap:4px;min-width:0}
.pin-open:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.pin-k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-v{display:flex;align-items:center;gap:8px}.pin-v b{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.pin-c{font-size:12px}.pin-c small{color:var(--muted);font-weight:400}
.pin-t{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin:hover{border-color:var(--line-2);background:var(--hover)}
.pin-empty{display:flex;align-items:center;gap:8px;margin:0;padding:14px 16px;border:1px dashed var(--line-2);border-radius:var(--r);font-size:13px;color:var(--ink-2)}
#pins .sec-row{margin:36px 0 12px;align-items:center}#pins .sec-row h2.sec{margin:0;font:600 13px/1.4 var(--text);color:var(--muted);letter-spacing:.02em}#pins .sec-row .link{font-size:13px}
.pin-col{display:grid;gap:8px;max-height:62vh;overflow:auto;padding-right:4px}.pin-col h4{margin:10px 0 2px;font-size:12px;color:var(--muted);font-weight:600}
.c-per{font-family:var(--text);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px;vertical-align:middle;background:var(--hover);border-radius:4px;padding:2px 6px}
.c-unit{font-family:var(--text);font-size:15px;font-weight:500;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.c-tr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;margin:6px 0 2px}
.c-trend{width:100%;height:34px;display:block}
.c-tr-l{display:grid;justify-items:end;gap:2px;font-size:12px;white-space:nowrap}.c-tr-l small{color:var(--muted);font-weight:400}
.c-tr-n{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.dash-k{display:inline-block;width:12px;border-top:1.5px dashed var(--accent)}
.cc.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transition:box-shadow var(--t3),border-color var(--t3)}
.link-in{width:100%;box-sizing:border-box;font:13px var(--text);padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;color:var(--ink-2);margin-bottom:12px}
.hmap td.hm,.heat td{vertical-align:middle}.hmap td.hm{text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}.hmap td.hm b{display:block;font-weight:600}.hmap td.hm small{color:var(--ink-2);font-size:11px}
.hm.g2{background:#e3f1e8}.hm.g1{background:#f1f8f3}.hm.r1{background:#fcf0ee}.hm.r2{background:#f8dcd8}.hm.na{color:var(--muted);text-align:right}
.heat td.hc{text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;padding:6px 2px;min-width:30px}.heat td.hc.low{background:#fbf1dc;color:#7a5200}.heat td.hc.out{background:#f8dcd8;color:var(--crit-t);font-weight:600}
.heat th{font-size:11px;line-height:1.2}.heat td small{display:block;color:var(--muted);font-size:11px}
.mini-bars{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:18px;height:130px;align-items:end;padding:0 0 18px}
.mini-bars span{position:relative;height:var(--h);display:flex;align-items:flex-end}.mini-bars i{display:block;width:100%;height:100%;background:var(--ink);border-radius:3px 3px 0 0;opacity:.85}.mini-bars span.over i{background:var(--neg)}
.mini-bars em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-style:normal;font-size:10.5px;color:var(--muted)}
.mini-bars .tline{position:absolute;left:0;right:0;bottom:calc(18px + (100% - 18px) * var(--t));border-top:1.5px dashed var(--accent)}
sup.sig{font-size:9.5px;color:var(--accent);margin-left:3px;font-weight:600}
.neg-t{color:var(--crit-t)}
.closed{color:var(--good-t);cursor:help}
.demo-chip{border-color:var(--accent);color:var(--accent);font-weight:600}.demo-chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.coach{position:fixed;right:28px;bottom:28px;z-index:100;width:380px;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:18px 20px 16px;box-shadow:0 22px 56px rgba(22,25,29,.32);animation:rise var(--t3) var(--e-exp)}
.coach .k{font-size:11.5px;color:#aab1bb;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.coach h4{margin:4px 0 6px;font:600 18px/1.3 var(--display);letter-spacing:-.01em}
.coach p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:#dde1e6}
.coach .row{display:flex;justify-content:space-between;align-items:center}.coach .row>span:last-child{display:flex;gap:12px;align-items:center}
.coach .dots{display:flex;gap:6px}.coach .dots i{width:7px;height:7px;border-radius:50%;background:#4a5059}.coach .dots i.on{background:#fff}
.coach .btn.primary{background:#fff;color:var(--ink);border-color:#fff}.coach .btn.primary:hover{background:#e9ecef}.coach .btn[disabled]{opacity:.6;cursor:progress}
.coach .link{color:#c3c9d1}
.demo-ring{box-shadow:0 0 0 3px var(--accent),0 0 0 8px rgba(31,91,214,.18)!important;animation:ring 1.3s var(--e-pro) infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--accent),0 0 0 12px rgba(31,91,214,.08)}}
.ask-g.demo-ring{border-radius:var(--r-sm)}
ul.build{list-style:none;margin:6px 0;padding:0;display:grid;gap:12px}
.bstep{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);transition:color var(--t2)}
.bstep .ic{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.bstep.run{color:var(--ink)}.bstep.run .ic{border-color:var(--line);border-top-color:var(--ink);animation:spin .7s linear infinite}
.bstep.done{color:var(--ink)}.bstep.done .ic{background:var(--good);border-color:var(--good)}.bstep.done .ic::after{content:"✓"}
.applied .fsel.ro{padding:0 12px 0 10px;animation:rise var(--t3) var(--e-exp) both;animation-delay:var(--d)}.applied .fsel.ro b{font-weight:500;color:var(--ink)}.applied .chip-f b{font-weight:600}
.to-chips{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 8px;min-height:38px}
.to-chip{background:var(--hover);border-radius:999px;padding:2px 10px;font-size:13px;animation:rise var(--t3) var(--e-exp)}.to-chip b{font-weight:600}
.attach{display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;color:var(--ink-2)}
.pin.new{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#print-stamp{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{min-width:0}
  header,#coach,#summary,h2.sec,#cards,#pins,.shelf,.sec-row,#acts,.page-foot,.band-tools,#pf-bar,.cc-h .icon-btn,#toast,#tip{display:none!important}
  .wrap{width:auto}
  .band{border:0;padding:0;margin:0;box-shadow:none}
  #print-stamp{display:grid;gap:2px;font-size:11px;color:#444;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:12px}#print-stamp b{font-size:14px;color:#111}
  .cc{break-inside:avoid}
}

/* panel */
.band{margin-top:16px;border:1px solid var(--accent);border-radius:var(--r-lg);background:#fff;box-shadow:0 10px 30px rgba(22,25,29,.07);scroll-margin-top:90px;overflow:hidden}
.band.open{animation:panel var(--t4) var(--e-exp)}
@keyframes panel{from{opacity:0;transform:translateY(-8px);clip-path:inset(0 0 60% 0 round 14px)}to{clip-path:inset(0 0 0 0 round 14px)}}
.band-h{display:flex;justify-content:space-between;gap:16px;padding:20px 28px 0}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:6px}
.crumbs i{font-style:normal}
.band-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;letter-spacing:-.012em;max-width:900px;text-wrap:balance}
.band-tools{display:flex;gap:6px;align-items:flex-start;flex:none}
.icon-btn{all:unset;box-sizing:border-box;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--ink-2);transition:border-color var(--t1),color var(--t1),background var(--t1)}
.icon-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.icon-btn.sm{width:28px;height:28px;border-color:transparent}
.icon-btn.sm:hover{border-color:var(--line)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.btn{height:36px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:0 14px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color var(--t1),background var(--t1)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#1a4dba;border-color:#1a4dba}
.btn.cta{color:var(--accent);border-color:#b7cbf3;background:#fff;font-weight:600}.btn.cta:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.rgm-btn{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pf{padding:16px 28px 0;display:grid;gap:10px}
.ask{position:relative;max-width:640px}
.ask input{background:#fff;color:var(--ink);width:100%;height:42px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 14px 0 38px;font-size:14px;transition:border-color var(--t1),box-shadow var(--t2)}
.ask input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ask-i{position:absolute;left:13px;top:13px;color:var(--muted)}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fsel{background:#fff;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 4px 0 10px;height:32px;font-size:13px;transition:background var(--t1),border-color var(--t1)}
.fsel span{color:var(--muted)}
.fsel select{border:0;background:transparent;font-size:13px;font-weight:500;padding:4px 2px;cursor:pointer}
.fsel.set{background:var(--accent-soft);border-color:#c9d8f8}.fsel.set select{color:var(--accent)}
.per{font-size:12.5px;color:var(--muted);margin-left:8px}
.ask-out{margin:0;font-size:13px;color:var(--ink-2);animation:rise var(--t3) var(--e-exp)}
.chip-f{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 9px;font-weight:500;line-height:22px}
.band-b{padding:20px 28px 28px}
.band-b.in .cc{animation:rise var(--t3) var(--e-exp) both;animation-delay:var(--d)}
.cluster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cc{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cc.wide,.cc:last-child:nth-child(odd){grid-column:1/-1}
.more-links{display:flex;gap:20px;margin-top:16px}
.cc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cc-h h3{margin:0;font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.cc-h h3:empty+p{margin-top:0}
.cc-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.cc-f{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.src{font-size:11.5px;color:var(--muted)}
.src::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--s3);margin-right:6px;vertical-align:1px}
.cc svg{display:block;width:100%;height:auto;overflow:visible}
.cc svg.fx{width:auto;max-width:100%}
.go{display:inline-block;font-size:13px}
.rgm-act{display:flex;gap:8px;margin-top:4px}
table.rgm tr.rec td{background:var(--accent-soft);font-weight:600}

/* charts */
svg .ax{fill:var(--muted);font-family:var(--text);font-size:11.5px}
svg .lbl{fill:var(--ink-2)}
svg .strong{fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.legend i.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2)}
.legend i.dash{width:16px;border-top:2px dashed #7b828b}
.legend i.dash.light{border-top:2px dotted #b9bfc7}
.dbars{display:flex;flex-direction:column;gap:6px}
.dbar{display:grid;grid-template-columns:190px 1fr 72px;gap:10px;align-items:center;font-size:13px;border-radius:6px;padding:2px}
.dbar.click{cursor:pointer}.dbar.click:hover{background:var(--hover)}
.dbar .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.dbar .dt{position:relative;height:14px}
.dbar .dt .mid{position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--line-2)}
.dbar .dt .b{position:absolute;top:2px;height:10px;border-radius:3px;animation:grow var(--t4) var(--e-exp) both}
.dbar .dt .b.pos{background:var(--s1)}.dbar .dt .b.neg{background:var(--neg)}
.dbar .dvv{text-align:right;font-weight:600}
.dbar .dvv.fav{color:var(--good)}.dbar .dvv.unf{color:var(--crit)}

/* tables, stats, diag */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}.t td.c,.t th.c{text-align:center}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--hover)}
.hr{font-size:13px}.hr.ok{color:var(--good)}.hr.no{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-family:var(--display);font-size:20px;font-weight:600}.stat .d{font-size:12px;color:var(--muted)}
dl.diag{margin:0;display:grid;grid-template-columns:130px 1fr;gap:9px 16px;font-size:14px}
dl.diag dt{font-size:12px;color:var(--muted);padding-top:2px}
dl.diag dd{margin:0}
dl.diag i{font-style:normal;color:var(--muted);padding:0 3px}
.sig{display:grid;grid-template-columns:52px 1fr auto;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.sig:first-of-type{border-top:0}.sig .wk{color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin:0}
.seg.sm button{padding:4px 9px;font-size:12px}
#b-tab{margin-top:10px}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chain .step{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:120px}
.chain .step span{font-size:12px;color:var(--muted)}.chain .step b{font-family:var(--display);font-size:17px}
.chain i{font-style:normal;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}

/* actions */
.act-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.seg-tabs{display:inline-flex;gap:4px}
.seg-tabs button{border:0;background:none;padding:7px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg-tabs button span{color:var(--muted);margin-left:4px;font-weight:400}
.seg-tabs button[aria-selected="true"]{background:var(--ink);color:#fff}.seg-tabs button[aria-selected="true"] span{color:#c9ced6}
.seg-tabs button.alert:not([aria-selected="true"]) span{color:var(--crit);font-weight:600}
.atable{border:1px solid var(--line);border-radius:var(--r-lg)}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 200px 110px 110px 130px 170px;gap:16px;align-items:center;padding:14px 18px;min-height:72px}
.ahead{min-height:0;padding:10px 18px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.arow-wrap{border-top:1px solid var(--line);transition:background var(--t2)}
.ahead+.arow-wrap{border-top:0}
.arow-wrap:hover{background:#fbfbfc}
.arow-wrap.flash{animation:flash 1.6s var(--e-pro)}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.a-ask{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-width:0}
.a-ask .chev{color:var(--muted);margin-top:3px;transition:transform var(--t2) var(--e-pro)}
.arow-wrap.exp .a-ask .chev{transform:rotate(90deg)}
.a-ask b{display:block;font-size:14px;font-weight:600;line-height:1.4}
.a-why{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.a-why em{font-style:normal;color:var(--crit);font-weight:500}
.a-own{font-size:13px;line-height:1.3}.a-own small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow>.num{font-size:13px}.arow>.num small{display:block;font-size:12px}
.od{color:var(--crit);font-weight:600}
.a-st{font-size:13px;display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:inline-block}
.dot.assigned{background:var(--accent)}.dot.in-progress{background:#e7a713}.dot.done{background:var(--good)}
.a-btn{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.r{text-align:right}
.a-exp{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:0 18px 20px 48px;animation:rise var(--t3) var(--e-exp)}
.a-exp h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.a-exp p{margin:0 0 6px;font-size:13.5px}
.stepper{list-style:none;margin:0 0 8px;padding:0;display:flex;gap:4px}
.stepper li{flex:1}
.stepper button{all:unset;cursor:pointer;display:block;font-size:12px;color:var(--muted);border-top:3px solid var(--track);padding-top:6px;width:100%}
.stepper li.done button{border-color:var(--accent);color:var(--ink);font-weight:500}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 14px 34px rgba(22,25,29,.14);padding:4px;display:grid;min-width:170px;animation:pop var(--t2) var(--e-exp)}
.menu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;font-size:13px}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.pager{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted)}
.pager span{margin-right:8px}
.pg{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:13px;color:var(--ink-2)}
.pg:hover{background:var(--hover)}.pg.on{background:var(--ink);color:#fff}
#acts.pg-in .atable{animation:rise var(--t3) var(--e-exp)}
.empty{padding:28px 18px;color:var(--muted);font-size:13.5px}
.nform{display:grid;grid-template-columns:2fr 1.2fr .8fr .7fr auto;gap:12px;align-items:end;border:1px solid var(--accent);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px;animation:rise var(--t3) var(--e-exp)}
.nform label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.nform input,.nform select{height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;font-size:13px;color:var(--ink)}
.nf-b{display:flex;gap:6px}

/* picker, loader, modal, toast, tooltip */
.picker{position:fixed;inset:0;z-index:70;background:rgba(255,255,255,.97);display:grid;place-items:center;animation:fade var(--t3)}
@keyframes fade{from{opacity:0}}
.picker-in{width:820px}
.picker h2{margin:0 0 8px;font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.015em}
.picker p{margin:0 0 24px;color:var(--ink-2)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:border-color var(--t1),transform var(--t2) var(--e-pro)}
.pick:hover{border-color:var(--ink);transform:translateY(-1px)}.pick:focus-visible{outline:2px solid var(--accent)}
.pick b{font-family:var(--display);font-size:20px;font-weight:600}.pick span{font-size:13px;color:var(--ink-2)}
.pick.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#home.loading{opacity:.25;pointer-events:none;transition:opacity var(--t3)}
.loader{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:50;display:grid;place-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.spinner{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:80;background:rgba(22,25,29,.32);display:grid;place-items:center;animation:fade var(--t2)}
.modal-in{background:#fff;border-radius:var(--r-lg);width:640px;max-height:88vh;overflow:auto;box-shadow:0 24px 64px rgba(22,25,29,.26);animation:rise var(--t3) var(--e-exp)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.modal-b{padding:16px 20px 20px;display:grid;gap:12px}
.modal-b textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px;font-size:13.5px;line-height:1.55;resize:vertical}
.modal-b select,.modal-b input{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;width:100%}
.modal-b .lab{font-size:12px;color:var(--muted)}
.pre{white-space:pre-wrap;font-family:var(--text);font-size:13.5px;line-height:1.55;background:var(--hover);border-radius:var(--r-sm);padding:14px;margin:0}
dl.mf{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;margin:0;font-size:13.5px}dl.mf dt{color:var(--muted)}dl.mf dd{margin:0}
.m-act{display:flex;gap:8px}
.close{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);font-size:20px;color:var(--ink-2)}
.close:hover{background:var(--hover)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 16px;font-size:13.5px;animation:rise var(--t3) var(--e-exp)}
#tip{position:fixed;z-index:95;pointer-events:none;background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(22,25,29,.12);max-width:320px}
#tip .th{font-weight:600;margin-bottom:4px}
#tip .f{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--ink-2)}
#tip .tr{display:flex;justify-content:space-between;gap:16px}
.page-foot{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== calmer surfaces: soft edges, status as a quiet chip ===== */
:root{--line-soft:#ebedf1;--lift:0 1px 2px rgba(22,25,29,.04)}
.card,.l2,.pin,.cc,.sum-card,.atable,.nform{border-color:var(--line-soft)}
.card,.l2,.sum-card{box-shadow:var(--lift)}
.card,.sum-card{border-radius:16px}
.card.s-crit,.card.s-warn,.l2.s-crit,.l2.s-warn,.pin.s-crit,.pin.s-warn{border-color:var(--line-soft)}
.card:hover,.l2:hover,.pin:hover{border-color:var(--line-2);background:#fff}
.cards{gap:20px}
.card{padding:0 22px 18px}
/* the status band becomes a chip: loud for bad news, quiet for good */
.c-head,.pin-head{background:none;border-radius:0}
.c-head{margin:0;padding:16px 0 8px}
.c-sig{font-size:11px;letter-spacing:.06em}
.s-crit>.c-head>.c-sig,.s-crit>.pin-head>.c-sig,.dr-card.s-crit>.c-head>.c-sig{background:var(--crit-bg);padding:3px 10px;border-radius:999px}
.s-warn>.c-head>.c-sig,.s-warn>.pin-head>.c-sig,.dr-card.s-warn>.c-head>.c-sig{background:var(--warn-bg);padding:3px 10px;border-radius:999px}
.c-head .c-per{background:none;color:var(--muted);padding:0}
/* the status chip and the text below it start on the same left edge */
.pin-head{padding:13px 10px 0 16px}
.pin-open{padding:7px 16px 14px;gap:3px}
.pin-row{align-items:stretch}
.pin-row .pin-empty{margin:0;align-self:stretch;align-items:flex-start;line-height:1.45;padding:16px;color:var(--muted);border-color:var(--line-soft)}
.pin-row .pin-empty svg{flex:none;margin-top:2px}
.pin-was{background:none;padding:0}
.iss.s-crit{background:none}
.band{border-color:#dbe4f8;box-shadow:0 6px 26px rgba(22,25,29,.05)}
.cc{border-radius:12px}

/* ===== panel header: headline on the left, Ask and filters on the right ===== */
.band-h{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:14px 36px;align-items:start;padding:22px 28px 18px}
.band-h h2{max-width:none}
.band-h-r{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:min-content;gap:10px;min-width:0;min-height:126px;align-content:start}
.ask-g{margin-bottom:0}
.c-tr{position:relative}
.c-tr-s{position:absolute;left:0;font-style:normal;font-size:10.5px;line-height:12px;color:var(--muted);background:rgba(255,255,255,.88);padding-right:4px;pointer-events:none;white-space:nowrap}
.dash-k{border-top-color:#8a929c}
.c-bar{position:relative;display:block;width:100%;height:10px;margin:12px 0;border-radius:5px;background:var(--track)}
.c-bar-f{position:absolute;left:0;top:0;height:100%;border-radius:5px;display:block;animation:grow var(--t4) var(--e-exp) both}
.c-bar-t{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink);border-radius:1px;display:block}
.tick-k{display:inline-block;width:2px;height:9px;background:var(--ink);vertical-align:-1px;margin-left:2px}
.pf .fbar{flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:10px;min-width:0;height:32px}
.pf .fbar .per{margin:0;white-space:nowrap;flex:none}
.pf .pop-wrap{min-width:0}
.pf .chip.filt{max-width:100%;overflow:hidden}
.pf .chip.filt>span:not(.f-sep):not(.k){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .chip.filt.set{border-color:var(--accent);color:var(--accent)}
.pf .chip.filt.set b{color:var(--accent)}
#pf-pop{right:0;left:auto;min-width:280px}
#pf-pop .fsel{width:100%;justify-content:space-between}
.band-tools{justify-content:flex-end}
.pf{padding:0;min-width:0;gap:8px}
.pf>*{min-width:0}
.ask{max-width:none}
.ask input{height:38px}
.fbar{gap:6px}
.band-b{padding-top:4px}

/* ===== summary: one block, each row reads status, metric, gap, why, action ===== */
.sum-card{display:block;padding:16px 24px 10px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.sum-meta{margin:0}
.sum-h{margin:6px 0 0;font-size:20.5px;line-height:1.34;max-width:none}
.sum-rows{margin-top:10px;border-top:1px solid var(--line-soft)}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:0 20px;align-items:center;border-bottom:1px solid var(--line-soft);transition:background var(--t1)}
.sum-row:hover{background:var(--hover)}
.sum-why{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 14px;column-gap:10px;align-items:start;padding:9px 8px 10px 13px;border-left:3px solid var(--sig,var(--line-2))}
.sum-why>span{grid-column:1;min-width:0}
.sum-why:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sum-s{display:flex;align-items:baseline;gap:8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sig,var(--muted))}
.sum-l{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.sum-hd{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;margin-top:2px}
.sum-hd>b{font-size:14px;font-weight:600}
.sum-g{font-size:13px;color:var(--ink-2)}.sum-g i{font-style:normal;color:var(--sig);margin-right:3px}.sum-g b{font-size:14px;font-weight:700;color:var(--sig);margin-right:2px}
.sum-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:1px}
.sum-go{grid-column:2;grid-row:1/span 3;align-self:center;color:var(--muted);font-style:normal;transition:transform var(--t1),color var(--t1)}
.sum-why:hover .sum-go{transform:translateX(2px);color:var(--ink)}
/* the next step belongs to the row above it, so it sits inside the same block */
.sum-nx{font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:3px}
.sum-nx b{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:7px}
.sum-nx.sug b{color:var(--opp)}
.sum-nx.none{color:var(--muted)}
.sum-nx small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.sum-cta{display:grid;align-content:center;padding-right:14px}
.sum-cta-r{display:flex;align-items:center;gap:6px}
.sum-cta-c{flex:1;min-width:0;display:grid;gap:5px;justify-items:center}
.sum-cta-c .btn{width:100%;justify-content:center}
.sum-cta-r .menu-wrap{flex:none}
.sum-cta .btn{justify-content:center;width:100%}
.sum-cta .link{font-size:12px}
.sum-foot{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:8px}
/* the headline arrow only takes room once you hover the sentence */
.say-go{display:inline-block;max-width:0;overflow:hidden;vertical-align:bottom;transition:max-width var(--t2) var(--e-pro),opacity var(--t1)}
.say:hover .say-go,.say:focus-visible .say-go{max-width:1.3em}
h2.sec{margin-top:18px}

/* ===== the watchlist sits beside the core metrics, one side-scrolling shelf ===== */
.shelf-h{margin:18px 0 12px;align-items:baseline}
.shelf-h h2.sec{margin:0}
.shelf{display:flex;align-items:stretch;gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:smooth;padding-bottom:10px}
.shelf>.cards{flex:0 0 100%}
.watch-group{flex:0 0 auto;display:flex;align-items:stretch;gap:20px}
.watch-group .pin{width:290px;flex:none;align-self:stretch}
.watch-group .pin-empty{width:300px;flex:none;margin:0;align-self:stretch;align-items:flex-start;padding:18px 16px}
.watch-lab{flex:none;width:150px;display:grid;align-content:center;gap:4px;padding-left:20px;border-left:1px solid var(--line-soft)}
.watch-lab b{font-family:var(--display);font-size:16px;font-weight:600}
.watch-lab span{font-size:12.5px;color:var(--muted);line-height:1.4}
.watch-lab .link{justify-self:start;font-size:12.5px}

/* ===== home v4: summary left, core metrics right, watchlist strip, actions in the first view ===== */
#home.wrap,.top-in{width:min(1376px,calc(100% - 48px))}
#home{padding-bottom:40px}
.top-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;margin-top:14px;align-items:stretch}
#home .summary{padding:0;display:flex}
#home .sum2{flex:1;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:16px 20px 14px}
.sum2 .sum-meta{margin:0;font-size:12.5px}
.sum2 .sum-h{margin:0;font-size:21px;line-height:1.34;max-width:none}
.sum2 .sum-more{margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
.sum2 .sum-more .say{font-weight:600}
.sum2 .iss-amt{color:var(--crit);font-weight:600;white-space:nowrap}
.sum2 .sum-foot2{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.sum2 .sum-foot2 .link{font-size:13px}
.sum2 .od-n{color:var(--crit);font-weight:600}
.metrics{display:flex;flex-direction:column;min-width:0}
.home-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 8px}
.home-h h2{margin:0;font-family:var(--text);font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink)}
.home-h p,.home-sub{margin:0;font-size:12.5px;color:var(--muted)}
#home .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1}
#home .cards .card:last-child:nth-child(odd){grid-column:1/-1}
.sum2 .sum-h{text-wrap:pretty}
#home .card{padding:0 16px 12px;gap:2px;min-height:0;grid-template-rows:auto auto auto auto auto 1fr}
#home .c-head{padding:11px 0 4px}
#home .c-name{font-size:14px}
#home .c-gap b{font-size:27px}
#home .c-now{font-size:13px}
#home .c-tr{display:block;margin:6px 0 0}
#home .c-trend{height:40px}
#home .c-tr-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:3px;font-size:12px}
#home .c-tr-n{font-size:12px}
#home .c-tr-s{font-size:11.5px}
#home .c-ins{min-height:0;padding-top:7px;margin-top:6px;font-size:12.5px;align-items:center}
#home .c-ins>span:first-child{-webkit-line-clamp:1}
#home .c-ins .prov{flex:none;margin-left:auto;font-size:11.5px}
#home .c-per{font-size:12px}
.strip{display:flex;align-items:stretch;gap:10px;margin-top:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:8px 10px 8px 16px;min-height:58px}
.strip .st-lab{display:flex;flex-direction:column;justify-content:center;flex:none;width:122px;font-size:12.5px;color:var(--muted);line-height:1.35}
.strip .st-lab b{font-size:14px;color:var(--ink)}
.strip .st-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.st-tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:6px 10px;border-radius:var(--r-sm);border:1px solid transparent;min-width:0}
.st-tile:hover,.st-tile:focus-visible{background:var(--hover);border-color:var(--line)}
.st-tile .st-dot{width:8px;height:8px;border-radius:50%;background:var(--sig,var(--line-2));grid-row:span 2}
.st-tile .st-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.st-tile .st-v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.st-tile .st-c{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-tile .st-c .dv{font-weight:600}
.st-tile .st-was{font-size:12px;color:var(--warn);text-align:right;white-space:nowrap}
.strip .st-empty{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.strip .st-all{flex:none;align-self:center;font-size:13px}
.acts-h{margin-top:22px}
#home .arow{min-height:60px;padding:10px 18px}
.demo-chip{border-color:var(--line-2);color:var(--ink-2);font-weight:500}
.issues-modal .sum-row[hidden]{display:grid!important}
.modal-in:has(.issues-modal){width:min(920px,92vw)}

.sum-moves{border-top:1px solid var(--line);padding-top:10px}
.sum-moves h4{margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sum-moves ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.sum-moves li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;padding:3px 0}
.sum-moves .st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sig,var(--line-2));margin-right:8px;vertical-align:1px}
.link-plain{all:unset;cursor:pointer;color:var(--ink)}.link-plain:hover,.link-plain:focus-visible{color:var(--accent);text-decoration:underline}

.k-main{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 128px;grid-template-areas:"head head" "name name" "fig tr" "why why";column-gap:16px;padding:0 20px 12px;border-radius:15px 15px 0 0;transition:background var(--t1)}

#tip.rich .tt-k{margin-top:7px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cc-h h3[data-def]{cursor:help}
.cc-h h3[data-def]{text-decoration:underline dotted var(--line-2);text-underline-offset:4px}
/* a saved bookmark: filled, blue, and a short pop when it is first saved */
[data-bookmark].saved,[data-bm-card].saved{color:var(--accent);background:var(--accent-soft);border-color:#c9d8f6}
[data-bookmark].saved svg path,[data-bm-card].saved svg path{fill:currentColor}
[data-bookmark].pop,[data-bm-card].pop{animation:bmPop .5s var(--e-exp)}
@keyframes bmPop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){[data-bookmark].pop,[data-bm-card].pop{animation:none}}
/* the summary is the list of issues: status, what, how far off, why; each line opens its analysis */
.sum-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.si{border-left:3px solid var(--sig,var(--line-2));border-bottom:1px solid var(--line-soft)}
.si:last-child{border-bottom:0}
.si-b{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 14px;column-gap:8px;width:100%;padding:8px 6px 9px 12px;border-radius:0 6px 6px 0}
.si-b:hover{background:var(--hover)}.si-b:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.si-h,.si-g,.si-w{grid-column:1}
.si-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.si-h b{font-size:14.5px;font-weight:600;color:var(--ink)}
.si-s{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sig)}
.si-g{font-size:13.5px;color:var(--ink-2)}.si-g i{font-style:normal;color:var(--sig);margin-right:3px}.si-g b{color:var(--sig);font-weight:700}
.si-w{font-size:13px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.si-go{grid-column:2;grid-row:1/span 3;align-self:center;font-style:normal;color:var(--muted)}.si-b:hover .si-go{color:var(--accent)}
.si-w{-webkit-line-clamp:1}
.si-b{padding:6px 6px 7px 12px}
/* the issue list scrolls after the first five, with a fade that says there is more */
.sum-list.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;-webkit-mask-image:linear-gradient(#000 85%,transparent);mask-image:linear-gradient(#000 85%,transparent)}
.sum-list.scroll.at-end{-webkit-mask-image:none;mask-image:none}
.sum2 .sum-more-n{align-self:flex-start;font-size:12.5px;margin-top:-4px}
/* issue count beside the Summary heading */
#sum-sub{font-size:13px;color:var(--ink-2)}#sum-sub b{color:var(--ink);font-weight:600}
.top-split .home-h{align-items:center}
/* the full watchlist, open in place */
.pins-all{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;padding:14px 16px;animation:rise var(--t3) var(--e-exp)}
.pins-all .pa-intro{margin:0 0 10px;font-size:13px;color:var(--muted)}
.pins-all .pa-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
/* summary: the issue list fills the card, with room to breathe */
.sum-list{position:relative}
.si-b{padding:12px 10px 13px 16px;row-gap:3px}
.si-h b{font-size:15px}
.si-g{font-size:14px}
.si-w{font-size:13.5px;-webkit-line-clamp:2;line-height:1.5}
/* round 2: every issue fits the card; two lines each (what and status, then how far off and why); no fade */
.sum-list.scroll{-webkit-mask-image:none;mask-image:none}
.si-b{padding:10px 10px 10px 14px;row-gap:2px}
.si-h b{font-size:14.5px}
.si-gw{grid-column:1;display:flex;align-items:baseline;gap:8px;min-width:0;font-size:13px;color:var(--ink-2)}
.si-gw .si-g{flex:none;font-size:13.5px}
.si-gw .si-w{-webkit-line-clamp:1;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px}
/* card why: full width, up to three lines; where the figure comes from moves to a quiet line underneath */
#home .k-why{display:grid;gap:2px}
#home .k-why>span:first-child{-webkit-line-clamp:3}
#home .k-why .prov{margin:0;font-size:10.5px}
.si-b{padding:8px 10px 8px 14px;row-gap:1px}
#home .sum2{gap:10px}
.sum2 .sum-foot2{padding-top:8px}
/* round 3: the reason is never cut short; gap and reason run as one sentence over up to two lines, and the list scrolls past what fits */
.si-gw{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;line-height:1.45}
.si-gw .si-g{margin-right:6px}
.si-gw .si-w{display:inline;white-space:normal;overflow:visible;text-overflow:clip;-webkit-line-clamp:unset}
.si-b{padding:10px 10px 11px 14px}
/* an on-track card that is a little behind shows the gap in ink, so green never sits on a down arrow */
.c-gap.tol i,.c-gap.tol b{color:var(--ink)}
/* rows take the card's spare height as padding (set by fitIssues) */
.si-b{padding:calc(10px + var(--si-x,0px)) 10px calc(11px + var(--si-x,0px)) 14px}
/* full watchlist: a title row with its own collapse control */
.pins-all .pa-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}.pins-all .pa-h b{font-size:14px;font-weight:600;color:var(--ink)}.pins-all .pa-x{font-size:13px}
/* landing ring for links into a section */
.jump{animation:jump 2.4s var(--e-exp);border-radius:var(--r-lg);scroll-margin-top:72px}
@keyframes jump{0%,55%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.jump{animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}}
